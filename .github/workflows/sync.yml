# Scheduled refresh: sync publications from Google Scholar, regenerate the CV,
# commit the refreshed data, build the site, and deploy to GitHub Pages.
name: Sync publications and CV

on:
  schedule:
    # Every Monday at 04:17 UTC
    - cron: "17 4 * * 1"
  # Allows manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: write # to commit refreshed data and CV
  pages: write # to deploy to GitHub Pages
  id-token: write # to deploy to GitHub Pages

# Share the "pages" concurrency group with the deploy workflow
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.147.2
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Sync publications from Google Scholar
        env:
          # Optional: set this secret for a more reliable sync than scraping.
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: python scripts/sync_publications.py

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended

      - name: Generate CV PDF
        run: python scripts/generate_cv.py

      - name: Commit refreshed data and CV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ cv/ static/cv.pdf
          if git diff --cached --quiet; then
            echo "Nothing to commit; the publication list is already up to date."
          else
            git commit -m "chore: sync publications from Google Scholar and rebuild CV"
            git push
          fi

      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: sync
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
