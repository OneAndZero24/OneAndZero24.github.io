name: Jan Miksa
positioning: Machine Learning Researcher

profile: >
  I am a Machine Learning Researcher and PhD Student at GMUM Jagiellonian
  University, currently working at IDEAS Research Institute. My research focuses
  on continual learning and machine unlearning, with an emphasis on the geometry
  and modularity of neural representations. I investigate how the structure of
  hidden representations can be used to control interference between tasks,
  preserve learned capabilities, and selectively modify neural network behaviour.
  My work combines mathematical perspectives on neural representations with
  empirical studies of deep learning systems, including large-scale diffusion
  models.

