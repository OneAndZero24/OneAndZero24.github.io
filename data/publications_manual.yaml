# Manual overrides and manual-only entries for the publication pipeline.
#
# This file is the human-editable layer on top of the automatic Google Scholar
# sync. The script scripts/sync_publications.py merges it with data fetched
# from Scholar and writes data/publications.yaml, which is what the website
# and the CV generator actually read. Edit this file, then run:
#
#     python3 scripts/sync_publications.py --offline
#
# to regenerate data/publications.yaml without hitting Scholar.
#
# How it works:
#   - "overrides" patches Scholar entries matched by scholar_id (or by title).
#     Any field listed here replaces the value from Scholar.
#   - "entries" adds publications that are not on Scholar yet.
#   - Both accept the same fields: id, title, authors (list), venue,
#     venue_details, status, status_label, year, links (paper/code/project/
#     bibtex), summary, tags, citations, featured, order, hidden.
#   - "order" controls the display order (lower shows first). Items without
#     an explicit order are sorted after ordered items, by year.

